# The project is bind-mounted into every service, so host edits are live.
#
# Networking: the dev servers and the traefik proxy bind hard-coded static IPs
# on the isolated `devnet` bridge (never 0.0.0.0, never the host's
# interfaces). The only way in from outside is traefik's published port,
# which is pinned to the host's loopback (127.0.0.1:8088), and traefik routes
# by hostname:
#   http://portfolio.localhost:8088 -> devsite
#   http://storybook.localhost:8088 -> storybook
services:
  # One-shot toolchain commands (install, lint, test, build, fmt, ...).
  app:
    image: docker.io/library/node:24-alpine
    working_dir: /app
    entrypoint: /app/entrypoint.sh
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Hostname-based reverse proxy: the single loopback-published entry point.
  proxy:
    image: docker.io/library/traefik:v3.7.13
    command:
      - --entrypoints.web.address=10.213.87.2:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --api.dashboard=false
      - --log.level=INFO
    ports:
      - "127.0.0.1:8088:80"
    networks:
      devnet:
        ipv4_address: 10.213.87.2
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro

  # Vite dev server: http://portfolio.localhost:8088
  devsite:
    image: docker.io/library/node:24-alpine
    working_dir: /app
    entrypoint: /app/entrypoint.sh
    command: start
    networks:
      devnet:
        ipv4_address: 10.213.87.10
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Portfolio admin editor: http://admin.localhost:8088
  admin:
    image: docker.io/library/node:24-alpine
    working_dir: /app
    entrypoint: /app/entrypoint.sh
    command: admin
    networks:
      devnet:
        ipv4_address: 10.213.87.12
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Storybook: http://storybook.localhost:8088
  storybook:
    image: docker.io/library/node:24-alpine
    working_dir: /app
    entrypoint: /app/entrypoint.sh
    command: storybook
    networks:
      devnet:
        ipv4_address: 10.213.87.11
    volumes:
      - .:/app
      - node_modules:/app/node_modules

networks:
  devnet:
    ipam:
      config:
        - subnet: 10.213.87.0/24

volumes:
  node_modules:
