# Traefik dynamic configuration (file provider — no docker socket needed).
# Routes by hostname to the dev servers on loopback: they share this proxy's
# network namespace (see compose.yaml).
http:
  routers:
    portfolio:
      rule: Host(`portfolio.localhost`)
      entryPoints:
        - web
      service: portfolio
    storybook:
      rule: Host(`storybook.localhost`)
      entryPoints:
        - web
      service: storybook
    admin:
      rule: Host(`admin.localhost`)
      entryPoints:
        - web
      service: admin

  services:
    portfolio:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8000"
    storybook:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:6006"
    admin:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8010"
