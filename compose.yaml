# The project is bind-mounted into every service, so host edits are live.
#
# Networking: every dev server binds 127.0.0.1, hard-coded, so `yarn start`
# is loopback-only wherever it runs. The dev servers share the traefik proxy's
# network namespace (network_mode: service:proxy), which makes that loopback
# the one traefik dials. Traefik itself binds its static IP on the isolated
# `devnet` bridge (never 0.0.0.0, never the host's interfaces), and the only
# way in from outside is its published port, pinned to the host's loopback
# (127.0.0.1:8088). Traefik routes by hostname:
#   http://portfolio.localhost:8088 -> devsite    (127.0.0.1:8000)
#   http://storybook.localhost:8088 -> storybook  (127.0.0.1:6006)
#   http://admin.localhost:8088     -> admin      (127.0.0.1:8010)
services:
  # One-shot toolchain commands (install, lint, test, build, fmt, ...).
  app:
    image: docker.io/library/node:24-alpine
    working_dir: /app
    entrypoint: /app/entrypoint.sh
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Hostname-based reverse proxy: the single loopback-published entry point.
  proxy:
    image: docker.io/library/traefik:v3.7.13
    command:
      - --entrypoints.web.address=10.213.87.2:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --api.dashboard=false
      - --log.level=INFO
    ports:
      - "127.0.0.1:8088:80"
    networks:
      devnet:
        ipv4_address: 10.213.87.2
    volumes:
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro

  # Vite dev server: http://portfolio.localhost:8088
  devsite:
    image: docker.io/library/node:24-alpine
    working_dir: /app
    entrypoint: /app/entrypoint.sh
    command: start
    network_mode: service:proxy
    depends_on:
      - proxy
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Portfolio admin editor: http://admin.localhost:8088
  admin:
    image: docker.io/library/node:24-alpine
    working_dir: /app
    entrypoint: /app/entrypoint.sh
    command: admin
    network_mode: service:proxy
    depends_on:
      - proxy
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  # Storybook: http://storybook.localhost:8088
  storybook:
    image: docker.io/library/node:24-alpine
    working_dir: /app
    entrypoint: /app/entrypoint.sh
    command: storybook
    network_mode: service:proxy
    depends_on:
      - proxy
    volumes:
      - .:/app
      - node_modules:/app/node_modules

networks:
  devnet:
    ipam:
      config:
        - subnet: 10.213.87.0/24

volumes:
  node_modules:
